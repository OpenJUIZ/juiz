[package]
name = "juiz_qmp_broker"
version = "0.0.27"
edition = "2021"
description = "QUIC (qmp) broker for JUIZ. juiz_app includes it by default."
license.workspace = true
repository = "https://github.com/OpenJUIZ/juiz"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# プラグインとして読み込むときのファイル名(libqmp_broker.so など)と、
# 設定ファイルの plugins.broker_factories.qmp_broker を変えないため、ライブラリ名は qmp_broker のまま
name = "qmp_broker"
crate-type = ["cdylib", "rlib"]

[dependencies]

juiz_core = { workspace = true }

serde_json = { workspace = true }


rustls = { version="0.23", default-features = false, features=[ "ring" ] }
rcgen = "0.13"
quinn = "0.11.3"
ring = "0.17"
quinn-proto = { version = "0.11.6", default-features = false }
tracing = { version = "0.1.10", default-features = false, features = ["std"] }
tracing-futures = { version = "0.2.0", default-features = false, features = ["std-future"] }

[dev-dependencies]
juiz_sdk = { workspace = true }
uuid = { workspace = true }
