"name": "test_system"
"option":
  "http_broker":
    "start": true
    "port": 8000
"plugins":
  "broker_factories":
    "qmp_broker":
      "path": "../../../../../../target/debug"
  "process_factories":
    "increment_process_python":
      "language": "python"
      "path": "../../../../../../examples/python/process/increment_process"
    "print_value_python":
      "language": "python"
      "path": "../../../../../../examples/python/process/increment_process"
  "ec_factories":
    "main_loop_ec":
      "path": "./target/debug"
"processes":
  - "type_name": "increment_process_python"
    "name": "pyinc0" 
    "publish": 
      - "print_topic"
    "use_memo": false
"brokers": 
  - "type_name": "qmp"
    "host": "0.0.0.0"
    "port": 5000
    "name": "0.0.0.0:5000"
"ecs":
  - "type_name": "main_loop_ec"
    "name": "main_ec"
    "rate": 1
    "bind":
      - "type_name": "increment_process_python"
        "name": "pyinc0"
    "auto_start": true