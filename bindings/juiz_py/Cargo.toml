[package]
name = "juiz_py"
version = "0.2.9"
edition = "2021"
description = "juiz command for Python (the PyPI package juiz-cli)"
license = "MIT OR Apache-2.0"
publish = false

# ルートのワークスペースには入れない。入れると、ワークスペースをまとめてビルドしたときに
# juiz_core の embed-python(pyo3/auto-initialize)と extension-module が同時に有効になる。
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Zenoh ブローカーを組み込む (docs/spec/zenoh-broker.md §8.2、#491)
zenoh-broker = ["juiz_app/zenoh-broker"]

[dependencies]
juiz_app = { path = "../../juiz_app", default-features = false, features = ["python-entry", "qmp-broker", "ipc-broker"] }
# libpython にはリンクせず、juiz を起動した Python プロセスの中で動く
juiz_core = { path = "../../juiz_core", default-features = false, features = ["extension-module", "swagger-ui", "webui"] }
# abi3: Python 3.10 以降の各版で同じ wheel を使う
pyo3 = { version = "0.30", features = ["abi3-py310"] }
