[package]
name = "juiz_py"
version = "0.0.16"
edition = "2021"
description = "juiz command for Python (the PyPI package juiz-cli)"
license = "MIT OR Apache-2.0"
publish = false

# ルートのワークスペースには入れない。入れると、ワークスペースをまとめてビルドしたときに
# juiz_core の embed-python(pyo3/auto-initialize)と extension-module が同時に有効になる。
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
juiz_app = { path = "../../juiz_app", default-features = false, features = ["python-entry"] }
# libpython にはリンクせず、juiz を起動した Python プロセスの中で動く
juiz_core = { path = "../../juiz_core", default-features = false, features = ["extension-module"] }
# abi3: Python 3.10 以降の各版で同じ wheel を使う
pyo3 = { version = "0.22.2", features = ["abi3-py310"] }
