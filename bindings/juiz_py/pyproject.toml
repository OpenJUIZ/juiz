[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# PyPI の "juiz" は既存の "julz" と紛らわしい名前として登録できないため juiz-cli にする
name = "juiz-cli"
version = "0.0.20"
description = "JUIZ robot middleware: the juiz command for Python users (no Rust toolchain needed)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "ysuga", email = "ysuga@ysuga.net" }]
keywords = ["robot", "middleware", "iot"]
# デコレータ(import juiz)は pyjuiz にある。版は juiz と揃える。
dependencies = ["pyjuiz==0.0.20"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://openjuiz.github.io/"
Repository = "https://github.com/OpenJUIZ/juiz"

[project.scripts]
juiz = "juiz_cli:main"

[tool.maturin]
# import juiz は pyjuiz が使うので、このパッケージは juiz_cli という名前にする
module-name = "juiz_cli._native"
python-source = "python"
