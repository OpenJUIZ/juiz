[package]
rust-version = "1.81"
name = "juiz_meta"
license.workspace = true
version = "0.4.0"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

#[dependencies]
#juiz_macro = {path=".", workspace=true}
#juiz_core = {path=".", workspace=true}
#juiz_sdk = {path=".", workspace=true}
#juiz_app = {path=".", workspace=true}


[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]

juiz_macro = {version="0.0.22", path="juiz_macro"}
juiz_sdk = {version="0.0.22", path="juiz_sdk"}
juiz_types = {version="0.0.22", path="juiz_types"}
juiz_idl = {version="0.0.22", path="juiz_idl"}
# 既定の feature(embed-python)は使う側で選ぶ(juiz_app/Cargo.toml を参照)
juiz_core = {version="0.0.22", path="juiz_core", default-features = false}
juiz_app= {version="0.0.22", path="juiz_app"}
juiz_qmp_broker = {version="0.0.22", path="brokers/qmp_broker"}
juiz_webui = {version="0.0.22", path="juiz_webui"}

anyhow = "1.0.89"
approx = "0.5.1"
axum = {version="0.7.7", features = ["multipart"]}
base64 = "0.22.1"


clap = { version="4.4.10", features = ["derive"] }

env_logger = "0.11.5"
futures = "0.3.29"
home = "0.5.9"
image = "0.24"
interprocess = {version="2.2.0", features=["tokio"]}
libloading = "0.8.5"
litrs = "0.4.1"
log = "0.4.20"
mopa = "0.2.2"
num-traits = "0.2.19"
nalgebra = "0.33.0"



proc-macro2 = {version = "1.0.89"}
# opencv = {version="0.92.0", default-features=false, features=["highgui", "videoio", "imgproc", "imgcodecs", "clang-runtime"], optional=true}
# auto-initialize と extension-module は juiz_core の feature で選ぶ(embed-python / extension-module)
pyo3 = {version = "0.22.2", features=["gil-refs"]}

quote = "1.0.37"
quaternion-core = "0.5.2"
regex = "1.10.6"
# TLS は rustls を使う(qmp_broker の quinn と ring を共有し、OpenSSL のビルドを省く)
reqwest = {version="0.12.8", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "charset", "http2", "system-proxy"]}
serde = {version = "1.0.209", features = ["derive"]}
serde_json="1.0.127"
sha2 = "0.11.1"
signal-hook = "0.3.17"

syn = { version = "2.0.87", features = ["full", "extra-traits", "parsing"] }
thiserror = "1.0.63"
tower-http = { version = "0.6.1", features = ["fs", "trace"] }
tokio = { version = "1.40.0", features = ["full"] }
uuid = {version = "1.10.0", features = ["v4"] }
utoipa = { version="4.2.3", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum", "vendored"] }

yaml-rust2 = "0.9.0"


# juiz_core = { path = "../../../../juiz_core/" }
[workspace]
members = [
    ".",
    "juiz_macro",
    "juiz_sdk",
    "juiz_types",
    "juiz_idl",
