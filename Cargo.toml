workspace.exclude = [
    "juiz_tutorial/rust/integer_component"
]

# デバッグ情報を行番号のみにして、コンパイル・リンク時間と target の容量を減らす。
# バックトレースの行番号は残る。デバッガで変数を見たい場合は一時的に debug = true に戻す。
[profile.dev]
debug = "line-tables-only"
