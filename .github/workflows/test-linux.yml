name: Test (Linux)

# Linux でのビルドとテスト(rust・opencv・zenoh・Linux の wheel)。
# PR と main・release/* への push と手動実行で動く。linux-aarch64 の wheel は PR では動かさない。
# カバレッジは coverage.yml(週 1 回と手動実行、#520)。
# macOS・Windows は test-macos.yml・test-windows.yml に分けてあり、main・release/* への push と手動実行でだけ動く。
# README のバッジを OS ごとに分けるため、ワークフローを OS ごとに分けている。
# draft の PR では何も動かさない(ready for review にしたときに動く)。
on:
  push:
    # release/* は保守用の枝(例: release/0.1)。cherry-pick した修正も main と同じテストにかける
    branches: [main, "release/**"]
    paths-ignore: &rust-ignore
      # Rust のビルドとテストに影響しないファイルだけの変更ではジョブを走らせない。
      # examples/python と bindings/pyjuiz は Rust のテストから使われるので対象に含める。
      - "**.md"
      - "Dockerfile"
      - "compose.yml"
      - "build_docker.sh"
      - ".github/workflows/python.yml"
      - "webui/**"
      - ".github/workflows/webui.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *rust-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3
  # Haskell の例のビルドに使う GHC と cabal の版。対応するのは GHC 9.6 以降(issue #131)で、その最小の系列で確かめる。
  # 入れた GHC はキャッシュするので、キャッシュのキーが変わらないよう版は細かく固定する
  GHC_VERSION: "9.6.7"
  CABAL_VERSION: "3.18.1.0"

jobs:
  # Rust のビルドとテスト(juiz_core / juiz_app / brokers など)
  # core::system は ../target/debug にビルド済みの例(Rust/C++)を読み込むため、
  # scripts/test.sh でテストの前に cargo build と C++ 例のビルドを済ませる。
  # 埋め込む Python は対応範囲の下限と最新の 2 版で確かめる(issue #100)。
  # setup-python の python3 が PATH の先頭に来るので、PYO3_PYTHON の python3 はその版になる。
  # 全テストを走らせるのは最新の版(scope: all)だけ。下限の版(scope: python)では、版で結果が変わり得る
  # 埋め込み Python に関わるテスト(名前に python・pyjuiz を含むもの、python-entry)だけを走らせる(#524)。
  # 外のビルドを呼ぶ遅いテスト(slow::)と Haskell は scope: all でだけ走る。
  # ジョブ名は必須チェックの名前になっているかもしれないので変えない
  rust:
    name: Rust build & test (Python ${{ matrix.python }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            scope: python
          - python: "3.14"
            scope: all
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang patchelf

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3 -m pip install pyyaml httpx pillow numpy

      - uses: dtolnay/rust-toolchain@stable

      # pyo3 のビルド結果は Python の版で変わるので、キャッシュを版ごとに分ける。
      # pyo3 のビルドスクリプトの結果には Python のパス(/opt/hostedtoolcache/Python/<版>/...)が入るので、
      # ランナーの Python のパッチ版が変わると古いパスで -lpython3.x が見つからずリンクに失敗する。パッチ版まで分ける
      # キャッシュの保存は main と release/* だけ(#520)。PR や手動実行の枝の保存は他の枝から読めず、
      # Actions のキャッシュの上限(10GB)を埋めて main の GHC などのキャッシュを追い出していた。
      # PR は main のキャッシュを読むだけにする
      - uses: Swatinem/rust-cache@v2
        with:
          key: python${{ steps.setup-python.outputs.python-version }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      # Haskell の例(examples/haskell)のビルドに使う GHC と cabal を入れる。
      # ghcup での GHC のインストールに Linux で約 2 分、macOS で約 4 分かかるので、入れた GHC をキャッシュする。
      # GHC の置き場所は ghcup と同じく ${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup/ghc/<版>
      - name: Locate ghcup directory
        if: matrix.scope == 'all'
        id: ghcup
        shell: bash
        run: echo "dir=${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup" >> "$GITHUB_OUTPUT"
      - name: Restore GHC
        if: matrix.scope == 'all'
        id: ghc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.ghcup.outputs.dir }}/ghc/${{ env.GHC_VERSION }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      # キャッシュに GHC があれば、haskell-actions/setup はインストールを飛ばして ghcup set だけする
      - uses: haskell-actions/setup@v2
        if: matrix.scope == 'all'
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          # examples/haskell の依存は GHC に付いてくるパッケージだけなので、Hackage の索引は使わない
          cabal-update: false
      # テストが失敗しても次から使えるよう、インストールした直後に保存する。
      # PR の枝に保存したキャッシュは他の枝から読めないので、main と release/* でだけ保存する(#520)
      - name: Save GHC
        if: >-
          matrix.scope == 'all'
          && steps.ghc-cache.outputs.cache-hit != 'true'
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.ghcup.outputs.dir }}/ghc/${{ env.GHC_VERSION }}
          key: ${{ steps.ghc-cache.outputs.cache-primary-key }}

      # Python 連携の feature の組み合わせがビルドできることを確かめる(issue #88)
      - name: Check feature combinations
        run: |
          cargo check -p juiz_app --no-default-features
          cargo check -p juiz_core --no-default-features --features extension-module
          cargo check -p juiz_app --no-default-features --features python-entry,juiz_core/extension-module

      # 例(Rust/C++)のビルド、Python パッケージの確認、PYTHONPATH の設定を済ませてから
      # cargo test -- --test-threads=1 を実行する(手元と同じスクリプト)
      - name: Build & test
        if: matrix.scope == 'all'
        env:
          # GHC が入っているので、Haskell の例とテストを飛ばさない
          JUIZ_REQUIRE_HASKELL: "1"
        run: scripts/test.sh --verbose

      # 埋め込み Python に関わるテストだけ(テスト名に python か pyjuiz を含むもの)。
      # juiz_core の統合テストと unit テスト、juiz_app の cli(juiz コマンドが埋め込み Python で Python の Process を動かす)。
      # Python を使うテストの名前には python か pyjuiz を入れる決まり(CONTRIBUTING.md の「名前」)。
      # --tests で doctest を外す(Python に関わる doctest は無い)
      - name: Build & test (Python tests only)
        if: matrix.scope == 'python'
        run: scripts/test.sh --verbose -p juiz_core -p juiz_app --tests -- python pyjuiz

      # Python から juiz を起動する入口(feature python-entry)のテスト
      - name: Test python-entry
        run: scripts/test.sh -p juiz_app --features python-entry --test python_entry_test

  # OpenCV を使うコンポーネント(examples/rust/component/juiz_opencv)のビルドとテスト。
  # opencv クレートはビルド時に libclang でシステムの OpenCV のヘッダからバインディングを生成するので、
  # libopencv-dev と libclang-dev を入れる。通常のテストと独立させ、失敗しても他のジョブに影響しない。
  # カメラや画面は使わず、画像の変換・色変換・ファイルの読み書きだけをテストする。
  opencv:
    name: OpenCV component build & test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: opencv
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      - name: Build
        run: cargo build -p juiz_opencv --verbose

      - name: Test
        run: cargo test -p juiz_opencv

  # Zenoh ブローカー(brokers/zenoh_broker、docs/spec/zenoh-broker.md)と juiz_app の feature zenoh-broker のビルドとテスト。
  # Zenoh を足すと初回ビルドが約 100 秒延びるので、juiz_zenoh_broker は default-members に入れず、
  # rust ジョブの時間を変えないよう、このジョブだけで別のキャッシュを使ってビルド・テストする(issue #491)。
  # Python の例は使わないが、juiz コマンドが既定の feature(embed-python)で libpython にリンクするので setup-python する。
  zenoh:
    name: Zenoh broker build & test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      # pyo3 のビルド結果に Python のパスが入るので、rust ジョブと同じくパッチ版までキーに入れる
      - uses: Swatinem/rust-cache@v2
        with:
          key: zenoh-python${{ steps.setup-python.outputs.python-version }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      # juiz(feature zenoh-broker)と例のプラグインのビルド、juiz_zenoh_broker と juiz_app の cli テストの zenoh::(手元と同じスクリプト)
      # Zenoh は共有メモリの pool 全体を mlock する。ランナーの一般ユーザーの RLIMIT_MEMLOCK (8 MiB) では
      # pool (既定 64 MiB) を作れず TCP に戻るので、共有メモリの経路も確かめるために上限を外す (§11.3)
      - name: Build & test
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l
          scripts/test-zenoh.sh --verbose

  # pip で入れる juiz(bindings/juiz_py、issue #88)の wheel を Linux でビルドし、
  # インストールした juiz コマンドで Python の Process とサンプルを動かす(juiz-wheels.yml)。
  # PR では Linux x86_64 だけ
  juiz-wheels:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/juiz-wheels.yml
    with:
      os: linux
      linux-only: ${{ github.event_name == 'pull_request' }}
