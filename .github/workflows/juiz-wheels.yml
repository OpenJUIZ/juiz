name: juiz wheels

# pip で入れる juiz(bindings/juiz_py、issue #88)の wheel を OS・CPU ごとにビルドし、
# インストールした juiz コマンドで Python の Process と juiz_examples_python のサンプルを動かす。
# Test(test-linux.yml・test-macos.yml・test-windows.yml)と Publish to PyPI(pypi-publish.yml)から呼ばれる。
# wheel は abi3(Python 3.10 以降で共通)なので、OS・CPU の組み合わせごとに1つだけ作る。
# 管理画面(webui)も先にビルドして wheel の juiz に埋め込み、/ui で配信されることを確かめる(issue #117)。
# ビルドした wheel は juiz-wheel-<名前> というアーティファクトに置く。
#
# sdist は作らない。maturin の sdist はルートの Cargo.toml(パッケージ juiz_meta を兼ねるワークスペース)を
# そのまま入れるため、展開した先で cargo がワークスペースを読めずビルドできない。
# wheel の無い環境では pip が「対応する配布物が無い」で止まり、cargo install juiz_app を使ってもらう。
#
# 呼び出し側は inputs.os で OS を絞れ(linux・macos・windows、既定はすべての組み合わせ)、
# inputs.linux-only で linux-x86_64 だけに絞れる。
# Test は OS ごとのワークフローからそれぞれの OS を指定して呼び、PR では linux-x86_64 だけにして Actions の実行時間を減らす。
on:
  workflow_call:
    inputs:
      linux-only:
        description: linux-x86_64 だけをビルドする
        type: boolean
        default: false
      os:
        description: ビルドする OS(linux・macos・windows)。空ならすべて
        type: string
        default: ""

jobs:
  wheel:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(inputs.linux-only && '["linux-x86_64"]'
          || inputs.os == 'linux' && '["linux-x86_64", "linux-aarch64"]'
          || inputs.os == 'macos' && '["macos-arm64", "macos-x86_64"]'
          || inputs.os == 'windows' && '["windows-x86_64"]'
          || '["linux-x86_64", "linux-aarch64", "macos-arm64", "macos-x86_64", "windows-x86_64"]') }}
    # 組み合わせの名前から、ランナーと maturin の target を引く
    runs-on: >-
      ${{ fromJSON('{"linux-x86_64": "ubuntu-24.04", "linux-aarch64": "ubuntu-24.04-arm",
      "macos-arm64": "macos-14", "macos-x86_64": "macos-15-intel", "windows-x86_64": "windows-latest"}')[matrix.name] }}
    env:
      TARGET: >-
        ${{ fromJSON('{"linux-x86_64": "x86_64", "linux-aarch64": "aarch64",
        "macos-arm64": "aarch64", "macos-x86_64": "x86_64", "windows-x86_64": "x64"}')[matrix.name] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # スモークテストで動かすサンプル
      - uses: actions/checkout@v4
        with:
          repository: OpenJUIZ/juiz_examples_python
          path: juiz_examples_python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 管理画面(webui)をビルドしておくと、juiz_core の build.rs が webui/dist を埋め込む(issue #117)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build webui
        working-directory: webui
        run: |
          npm ci
          npm run build

      # Linux では manylinux のコンテナの中でビルドする(古い glibc の Linux でも入るように)
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/juiz_py
          target: ${{ env.TARGET }}
          manylinux: auto
          args: --release --out dist
          sccache: "true"

      - name: Install wheel
        run: |
          python -m venv .venv
          # 以降のステップで venv の python と juiz を使う(Windows の PATH には Windows 形式で書く)
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin=.venv/Scripts
            cygpath -w "$PWD/$bin" >> "$GITHUB_PATH"
          else
            bin=.venv/bin
            echo "$PWD/$bin" >> "$GITHUB_PATH"
          fi
          # pyjuiz は PyPI の版ではなくリポジトリのものを先に入れる
          "$bin/python" -m pip install ./bindings/pyjuiz
          "$bin/python" -m pip install bindings/juiz_py/dist/*.whl

      - name: Smoke test
        run: python bindings/juiz_py/tests/smoke_test.py juiz_examples_python

      - uses: actions/upload-artifact@v4
        with:
          name: juiz-wheel-${{ matrix.name }}
          path: bindings/juiz_py/dist/*.whl
