name: Publish to crates.io

# v* タグ(例: v0.0.9)の push で juiz_macro / juiz_sdk / juiz_core / juiz_app を crates.io に公開する。
# 4 つのクレートは同じバージョンで揃えて公開する。タグのバージョンがどれかの Cargo.toml と
# 一致しない場合は公開しない。
# 手動実行(workflow_dispatch)では cargo publish --dry-run だけを行い、実際には公開しない。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3
  # 公開するクレート。cargo publish が依存順(macro → sdk → core → app)に並べ替えて公開する。
  PUBLISH_PACKAGES: juiz_macro juiz_sdk juiz_core juiz_app

jobs:
  # タグのバージョンと公開する全クレートの Cargo.toml の version が一致するか確認する
  check-version:
    name: Check tag and crate versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with Cargo.toml versions
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            # 手動実行ではタグが無いので、juiz_core のバージョンに揃っているかだけを見る
            expected=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "juiz_core") | .version')
          fi
          echo "Expected version: $expected"
          ok=true
          for pkg in $PUBLISH_PACKAGES; do
            ver=$(cargo metadata --no-deps --format-version 1 | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')
            if [ "$ver" = "$expected" ]; then
              echo "ok: $pkg $ver"
            else
              echo "::error::$pkg のバージョン $ver がタグのバージョン $expected と一致しません"
              ok=false
            fi
          done
          $ok

  # 公開前にビルドとテストを通す(test.yml の rust ジョブと同じ手順)
  test:
    name: Rust build & test
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang python3-dev python3-pip

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3 -m pip install --break-system-packages pyyaml httpx pillow docstring_parser

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (default workspace members)
        run: cargo build --verbose

      - name: Build C++ examples
        run: |
          cmake -S examples/cpp -B examples/cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/cpp/build --parallel

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/pyjuiz
        run: cargo test --verbose -- --test-threads=1

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev

      # 複数クレートをまとめて依存順に公開する cargo publish -p ... は Rust 1.90 以降が必要
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          args=""
          for pkg in $PUBLISH_PACKAGES; do args="$args -p $pkg"; done
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            cargo publish $args
          else
            cargo publish --dry-run $args
          fi
