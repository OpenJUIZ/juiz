name: Publish to crates.io

# v* タグ(例: v0.0.9)の push で juiz_types / juiz_idl / juiz_macro / juiz_sdk / juiz_webui / juiz_core / juiz_qmp_broker / juiz_app を crates.io に公開する。
# 8 つのクレートは同じバージョンで揃えて公開する。タグのバージョンがどれかの Cargo.toml と
# 一致しない場合は公開しない。
# 手動実行(workflow_dispatch)では cargo publish --dry-run だけを行い、実際には公開しない。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3
  # 公開するクレート。cargo publish が依存順(types → idl・macro → sdk → core → qmp_broker → app)に並べ替えて公開する。
  # juiz_webui(管理画面のビルド成果物、issue #117)はこれらより先に、git の外から別に公開する(publish ジョブを参照)。
  PUBLISH_PACKAGES: juiz_types juiz_idl juiz_macro juiz_sdk juiz_webui juiz_core juiz_qmp_broker juiz_app
  WORKSPACE_PUBLISH_PACKAGES: juiz_types juiz_idl juiz_macro juiz_sdk juiz_core juiz_qmp_broker juiz_app

jobs:
  # タグのバージョンと公開する全クレートの Cargo.toml の version が一致するか確認する
  check-version:
    name: Check tag and crate versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with Cargo.toml versions
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            # 手動実行ではタグが無いので、juiz_core のバージョンに揃っているかだけを見る
            expected=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "juiz_core") | .version')
          fi
          echo "Expected version: $expected"
          ok=true
          for pkg in $PUBLISH_PACKAGES; do
            ver=$(cargo metadata --no-deps --format-version 1 | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')
            if [ "$ver" = "$expected" ]; then
              echo "ok: $pkg $ver"
            else
              echo "::error::$pkg のバージョン $ver がタグのバージョン $expected と一致しません"
              ok=false
            fi
          done
          $ok

  # 公開前にビルドとテストを通す(test.yml の rust ジョブと同じ手順)
  test:
    name: Rust build & test
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang python3-dev python3-pip

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3 -m pip install --break-system-packages pyyaml httpx pillow docstring_parser numpy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (default workspace members)
        run: cargo build --verbose

      - name: Build C++ examples
        run: |
          cmake -S examples/cpp -B examples/cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/cpp/build --parallel

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/pyjuiz
        run: cargo test --verbose -- --test-threads=1

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev

      # 複数クレートをまとめて依存順に公開する cargo publish -p ... は Rust 1.90 以降が必要
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 管理画面(webui)をビルドし、juiz_webui クレートに同梱する(issue #117)。
      # cargo だけで juiz を入れる人が Node.js を要らないようにするため。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build webui
        run: |
          (cd webui && npm ci && npm run build)
          test -f webui/dist/index.html

      # ビルド成果物は git 管理外なので、リポジトリの中で cargo publish すると dirty 扱いになる。
      # juiz_webui だけを git の外の一時ディレクトリにコピーし、そこから公開する
      # (VCS の確認が行われないので --allow-dirty は要らない。ほかのクレートは普段どおりリポジトリから公開する)。
      - name: Stage juiz_webui
        run: |
          dir="$RUNNER_TEMP/juiz_webui"
          rm -rf "$dir"
          mkdir -p "$dir"
          cp -r juiz_webui/Cargo.toml juiz_webui/build.rs juiz_webui/src juiz_webui/LICENSE-* "$dir"/
          cp -r webui/dist "$dir/dist"
          # リポジトリのワークスペースから切り離す
          printf '\n[workspace]\n' >> "$dir/Cargo.toml"
          echo "WEBUI_STAGE=$dir" >> "$GITHUB_ENV"

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          args=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # 途中で失敗したあとタグを打ち直したときのため、crates.io に公開済みの版は飛ばす
            ver="${GITHUB_REF_NAME#v}"
            published() {
              status=$(curl -s -o /dev/null -w '%{http_code}' -A "OpenJUIZ/juiz publish workflow" "https://crates.io/api/v1/crates/$1/$ver")
              [ "$status" = "200" ]
            }
            # juiz_core が使うので juiz_webui を先に公開する
            if published juiz_webui; then
              echo "skip: juiz_webui $ver は公開済み"
            else
              (cd "$WEBUI_STAGE" && cargo publish)
            fi
            for pkg in $WORKSPACE_PUBLISH_PACKAGES; do
              if published "$pkg"; then
                echo "skip: $pkg $ver は公開済み"
              else
                args="$args -p $pkg"
              fi
            done
            if [ -z "$args" ]; then
              echo "すべてのクレートが公開済みです"
              exit 0
            fi
            cargo publish $args
          else
            (cd "$WEBUI_STAGE" && cargo publish --dry-run)
            # juiz_webui のこの版はまだ crates.io に無いので、確認ではワークスペースの juiz_webui も一緒に
            # パッケージにする。そのために画面を juiz_webui/dist に置く(公開しないので dirty でも構わない)
            cp -r webui/dist juiz_webui/dist
            for pkg in $PUBLISH_PACKAGES; do args="$args -p $pkg"; done
            cargo publish --allow-dirty --dry-run $args
          fi

      # cargo publish が target/package に展開したクレートは、rust-cache の後処理が
      # tests/target などを探して ENOENT エラーを出すので、キャッシュ保存前に消しておく
      - name: Remove packaged crates
        if: always()
        run: rm -rf target/package
