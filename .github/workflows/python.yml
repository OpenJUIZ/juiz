name: Python

on:
  push:
    # release/* は保守用の枝(例: release/0.1)。cherry-pick した修正も main と同じテストにかける
    branches: [main, "release/**"]
    paths: &python-paths
      - "bindings/pyjuiz/**"
      - "examples/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *python-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python バインディング(pyjuiz)と Python の例
  python:
    name: Python bindings & examples (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    # 対応範囲の下限と最新の 2 版で確かめる(issue #100)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pyjuiz
        run: python -m pip install ./bindings/pyjuiz

      - name: Syntax check Python sources
        run: python -m compileall -q bindings/pyjuiz examples/python

      # test/unit/*_test.py を集めて 1 本ずつ実行する(issue #525)。足したテストは名指し不要。
      # juiz の System が要る test/system/ は Rust の統合テスト(test-linux.yml)から起動する
      - name: Run pyjuiz unit tests
        working-directory: bindings/pyjuiz
        run: python test/run_unit_tests.py
