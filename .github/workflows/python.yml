name: Python

on:
  push:
    branches: [main]
    paths: &python-paths
      - "bindings/pyjuiz/**"
      - "examples/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *python-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python バインディング(pyjuiz)と Python の例
  python:
    name: Python bindings & examples (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    # 対応範囲の下限と最新の 2 版で確かめる(issue #100)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pyjuiz
        run: python -m pip install ./bindings/pyjuiz

      - name: Syntax check Python sources
        run: python -m compileall -q bindings/pyjuiz examples/python

      - name: Run pyjuiz decorator test
        working-directory: bindings/pyjuiz
        run: python test/decorator_test.py

      - name: Run pyjuiz identifier test
        working-directory: bindings/pyjuiz
        run: python test/identifier_test.py

      - name: Run pyjuiz datatype test
        working-directory: bindings/pyjuiz
        run: python test/datatype_test.py

      - name: Run pyjuiz IPC frame test
        working-directory: bindings/pyjuiz
        run: python test/ipc_frame_test.py

      - name: Run pyjuiz standard types test
        working-directory: bindings/pyjuiz
        run: python test/std_types_test.py
