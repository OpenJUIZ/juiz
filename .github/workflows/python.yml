name: Python

on:
  push:
    branches: [main]
    paths: &python-paths
      - "bindings/pyjuiz/**"
      - "examples/python/**"
      - "juiz_tutorial/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *python-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python バインディング(pyjuiz)と Python の例
  python:
    name: Python bindings & examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyjuiz
        run: python -m pip install ./bindings/pyjuiz

      - name: Syntax check Python sources
        run: python -m compileall -q bindings/pyjuiz examples/python juiz_tutorial

      - name: Run pyjuiz decorator test
        working-directory: bindings/pyjuiz
        run: python test/decorator_test.py

      - name: Run pyjuiz identifier test
        working-directory: bindings/pyjuiz
        run: python test/identifier_test.py

      - name: Run pyjuiz datatype test
        working-directory: bindings/pyjuiz
        run: python test/datatype_test.py

      - name: Run pyjuiz standard types test
        working-directory: bindings/pyjuiz
        run: python test/std_types_test.py
