name: Test

# PR では Linux のジョブ(rust・opencv・Linux x86_64 の wheel)だけを動かし、
# macOS・Windows のジョブ、残りの wheel、coverage は main への push と手動実行で動かす。
# macOS は Linux の 10 倍、Windows は 2 倍で数えられ、PR のたびに動かすと Actions の
# 実行時間の大半を占めていたため。PR で macOS・Windows も確かめたいときは、
# Actions の画面から PR のブランチを指定して Test を手動実行する。
# draft の PR では何も動かさない(ready for review にしたときに動く)。
on:
  push:
    branches: [main]
    paths-ignore: &rust-ignore
      # Rust のビルドとテストに影響しないファイルだけの変更ではジョブを走らせない。
      # examples/python と bindings/pyjuiz は Rust のテストから使われるので対象に含める。
      - "**.md"
      - "juiz_tutorial/**"
      - "Dockerfile"
      - "compose.yml"
      - "build_docker.sh"
      - ".github/workflows/python.yml"
      - "webui/**"
      - ".github/workflows/webui.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *rust-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3

jobs:
  # Rust のビルドとテスト(juiz_core / juiz_app / brokers など)
  # system_test は ../target/debug にビルド済みの例(Rust/C++)を読み込むため、
  # scripts/test.sh でテストの前に cargo build と C++ 例のビルドを済ませる。
  rust:
    name: Rust build & test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang python3-dev python3-pip

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3 -m pip install --break-system-packages pyyaml httpx pillow docstring_parser numpy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Haskell の例(examples/haskell)のビルドに使う。対応するのは GHC 9.6 以降(issue #131)
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest

      # Python 連携の feature の組み合わせがビルドできることを確かめる(issue #88)
      - name: Check feature combinations
        run: |
          cargo check -p juiz_app --no-default-features
          cargo check -p juiz_core --no-default-features --features extension-module
          cargo check -p juiz_app --no-default-features --features python-entry,juiz_core/extension-module

      # 例(Rust/C++)のビルド、Python パッケージの確認、PYTHONPATH の設定を済ませてから
      # cargo test -- --test-threads=1 を実行する(手元と同じスクリプト)
      - name: Build & test
        env:
          # GHC が入っているので、Haskell の例とテストを飛ばさない
          JUIZ_REQUIRE_HASKELL: "1"
        run: scripts/test.sh --verbose

      # Python から juiz を起動する入口(feature python-entry)のテスト
      - name: Test python-entry
        run: scripts/test.sh -p juiz_app --features python-entry --test python_entry_test

  # macOS での Haskell のプラグインのビルドとテスト(issue #143)。macos-latest は Xcode 26 に
  # Command Line Tools 27 (MacOSX27.0.sdk) が入っていて、GHC のリンクでその SDK を読む組み合わせを確かめる。
  # examples/haskell/build.sh が DEVELOPER_DIR を切り替える。Haskell 以外のテストは Linux のジョブで確かめる。
  haskell-macos:
    name: Haskell plugin test (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      # macOS の python3 は新しすぎて PyO3 が対応していないので、setup-python の 3.13 を使う(issue #100)
      PYO3_PYTHON: python3.13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3.13 -m pip install pyyaml httpx pillow docstring_parser numpy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest

      # C++ の例のビルドと Haskell の型付きの例 (gen/ の型) に juiz-idl も使う。
      # haskell_typed_test は Rust の native_pose_component・native_pose_reader も読み込む
      - name: Build libjuiz_sdk and juiz-idl
        run: cargo build -p juiz_sdk -p juiz_idl -p native_pose_component -p native_pose_reader

      # haskell_container_test は C++ の Container (example_container_cpp) も読み込む
      - name: Build C++ examples
        run: |
          cmake -S examples/cpp -B examples/cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/cpp/build --config Debug --parallel

      - name: Build Haskell examples
        run: examples/haskell/build.sh

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/pyjuiz
          # Haskell の例が無いときにテストを飛ばさない
          JUIZ_REQUIRE_HASKELL: "1"
        run: >-
          cargo test -p juiz_core --no-fail-fast --test integration
          -- --test-threads=1 haskell_

  # OpenCV を使うコンポーネント(examples/rust/component/juiz_opencv)のビルドとテスト。
  # opencv クレートはビルド時に libclang でシステムの OpenCV のヘッダからバインディングを生成するので、
  # libopencv-dev と libclang-dev を入れる。通常のテストと独立させ、失敗しても他のジョブに影響しない。
  # カメラや画面は使わず、画像の変換・色変換・ファイルの読み書きだけをテストする。
  opencv:
    name: OpenCV component build & test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: opencv

      - name: Build
        run: cargo build -p juiz_opencv --verbose

      - name: Test
        run: cargo test -p juiz_opencv

  # Windows でのビルドとテスト。Python は actions/setup-python で入れ、
  # pyo3(auto-initialize)がその libpython にリンクする。C++ の例は MSVC と cmake でビルドする。
  windows:
    name: Windows build & test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      # windows-latest の python3 は Microsoft Store のスタブになることがあるので python を使う
      PYO3_PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python -m pip install pyyaml httpx pillow docstring_parser numpy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Windows で失敗するテストをまとめて把握できるよう --no-fail-fast で最後まで実行する
      - name: Build & test
        run: scripts/test.sh --no-fail-fast

      - name: Test python-entry
        run: scripts/test.sh -p juiz_app --features python-entry --test python_entry_test

  # pip で入れる juiz(bindings/juiz_py、issue #88)の wheel を Linux・macOS・Windows でビルドし、
  # インストールした juiz コマンドで Python の Process とサンプルを動かす(juiz-wheels.yml)。
  # PR では Linux x86_64 だけ
  juiz-wheels:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/juiz-wheels.yml
    with:
      linux-only: ${{ github.event_name == 'pull_request' }}

  # テストカバレッジ(cargo-llvm-cov)。結果はジョブサマリーに表示し、
  # main への push 時は shields.io 用の JSON を badges ブランチに置いて README のバッジに使う。
  # rust ジョブとほぼ同じビルドとテストをやり直すので、PR では動かさない。
  coverage:
    name: Coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang python3-dev python3-pip

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3 -m pip install --break-system-packages pyyaml httpx pillow docstring_parser numpy

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      # system_test が読み込む例(Rust/C++)は通常ビルドで ../target/debug などに用意する
      - name: Prepare tests (build examples, check Python packages)
        run: scripts/test.sh --prepare-only

      # パッケージを指定しないと cargo-llvm-cov はルートパッケージ(juiz_meta)だけを集計し、
      # サブディレクトリのメンバーが除外されて 0% になるので、default-members を明示する。
      - name: Select default workspace members
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_default_members as $d | [.packages[] | select(.id as $i | $d | index($i)) | "-p " + .name] | join(" ")')
          echo "COV_PACKAGES=$pkgs" >> "$GITHUB_ENV"

      - name: Test with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/pyjuiz
        run: cargo llvm-cov --no-report $COV_PACKAGES -- --test-threads=1

      - name: Coverage report
        run: |
          cargo llvm-cov report $COV_PACKAGES --lcov --output-path lcov.info
          cargo llvm-cov report $COV_PACKAGES --json --summary-only --output-path coverage-summary.json
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report $COV_PACKAGES --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Publish coverage badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(jq '.data[0].totals.lines.percent' coverage-summary.json)
          label=$(printf '%.1f%%' "$pct")
          color=$(awk -v p="$pct" 'BEGIN { if (p >= 80) print "brightgreen"; else if (p >= 60) print "yellow"; else if (p >= 40) print "orange"; else print "red" }')
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' "$label" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Update coverage badge: $label"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
