name: Test

on:
  push:
    branches: [main]
    paths-ignore: &rust-ignore
      # Rust のビルドとテストに影響しないファイルだけの変更ではジョブを走らせない。
      # examples/python と bindings/pyjuiz は Rust のテストから使われるので対象に含める。
      - "**.md"
      - "juiz_tutorial/**"
      - "Dockerfile"
      - "compose.yml"
      - "build_docker.sh"
      - ".github/workflows/python.yml"
  pull_request:
    paths-ignore: *rust-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3

jobs:
  # Rust のビルドとテスト(juiz_core / juiz_app / brokers など)
  # system_test は ../target/debug にビルド済みの例(Rust/C++)を読み込むため、
  # テストの前に cargo build と C++ 例のビルドを済ませる。
  rust:
    name: Rust build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang python3-dev python3-pip

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python3 -m pip install --break-system-packages pyyaml httpx pillow docstring_parser

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (default workspace members)
        run: cargo build --verbose

      - name: Build C++ examples
        run: |
          cmake -S examples/cpp -B examples/cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/cpp/build --parallel

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/pyjuiz
        # テストはブローカーのポートや埋め込み Python を使うので直列に実行する
        run: cargo test --verbose -- --test-threads=1
