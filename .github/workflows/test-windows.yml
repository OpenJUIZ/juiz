name: Test (Windows)

# Windows でのビルドとテストと Windows の wheel。
# macOS は Linux の 10 倍、Windows は 2 倍で数えられ、PR のたびに動かすと Actions の
# 実行時間の大半を占めていたため、PR では動かさず main への push と手動実行でだけ動かす。
# PR で確かめたいときは、Actions の画面から PR のブランチを指定して手動実行する。
# Linux のジョブは test-linux.yml。
on:
  push:
    branches: [main]
    paths-ignore:
      # Rust のビルドとテストに影響しないファイルだけの変更ではジョブを走らせない。
      # examples/python と bindings/pyjuiz は Rust のテストから使われるので対象に含める。
      - "**.md"
      - "juiz_tutorial/**"
      - "Dockerfile"
      - "compose.yml"
      - "build_docker.sh"
      - ".github/workflows/python.yml"
      - "webui/**"
      - ".github/workflows/webui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3

jobs:
  # Windows でのビルドとテスト。Python は actions/setup-python で入れ、
  # pyo3(auto-initialize)がその libpython にリンクする。C++ の例は MSVC と cmake でビルドする。
  windows:
    name: Windows build & test
    if: ${{ false }} # TEMP: issue #137 の調査中
    runs-on: windows-latest
    env:
      # windows-latest の python3 は Microsoft Store のスタブになることがあるので python を使う
      PYO3_PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python -m pip install pyyaml httpx pillow docstring_parser numpy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Windows で失敗するテストをまとめて把握できるよう --no-fail-fast で最後まで実行する
      - name: Build & test
        run: scripts/test.sh --no-fail-fast

      - name: Test python-entry
        run: scripts/test.sh -p juiz_app --features python-entry --test python_entry_test

  # pip で入れる juiz(bindings/juiz_py、issue #88)の wheel を Windows でビルドし、
  # インストールした juiz コマンドで Python の Process とサンプルを動かす(juiz-wheels.yml)
  juiz-wheels:
    if: ${{ false }} # TEMP: issue #137 の調査中
    uses: ./.github/workflows/juiz-wheels.yml
    with:
      os: windows

  # TEMP: issue #137 の調査
  haskell-probe:
    name: Haskell probe
    runs-on: windows-latest
    env:
      PYO3_PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml httpx pillow docstring_parser numpy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.18.1.0"
          cabal-update: false
      - run: |
          which ghc cabal; ghc --version; cabal --version; ghc --info | grep -i -E "dynamic|ld|cc|linker" || true
          echo "HOME=$HOME"; ls /c/ghcup 2>/dev/null | head || true
      - run: cargo build -p juiz_sdk -p juiz_idl
      - run: ls target/debug | grep -i -E "juiz_sdk|idl"
      - name: build haskell
        run: examples/haskell/build.sh -v1 || (echo BUILD FAILED; exit 1)
      - name: test
        if: always()
        env:
          JUIZ_REQUIRE_HASKELL: "1"
          RUST_BACKTRACE: "0"
        run: |
          set -o pipefail
          for v in probef probeg probeh probee; do TMPV=$v scripts/test.sh -p juiz_core --test integration -- tmp_info_variant --nocapture 2>&1 | grep -E "TEMP|hsjuiz|panicked|0xc0|ERROR" | tail -10 || true; done
          scripts/test.sh -p juiz_core --test integration -- haskell plugin_images_through_ipc > /tmp/t.log 2>&1 || { tail -n 30 /tmp/t.log; grep -n -E "^test |panicked|rror|hsjuiz:" /tmp/t.log | grep -v "warning" | head -120; exit 1; }
      - name: inspect
        if: always()
        run: |
          BIN="$(dirname "$(find /c/ghcup -name llvm-objdump.exe | head -n 1)")"
          cd examples/haskell
          o=$(find dist-newstyle -path "*hsjuiz*" -name "Image.o" | head -n 1)
          echo "obj=$o"; "$BIN/llvm-objdump.exe" -r "$o" | awk 'NF==3 {print $2}' | sort | uniq -c
          o2=$(find dist-newstyle -path "*image_component_hs*" -name "ImageComponent.o" | head -n 1)
          echo "obj=$o2"; "$BIN/llvm-objdump.exe" -r "$o2" | awk 'NF==3 {print $2}' | sort | uniq -c
          "$BIN/llvm-objdump.exe" -r "$o" | grep -i "ADDR32 " | head -20
          d=$(find dist-newstyle -name image_component_hs.dll | head -n 1)
          "$BIN/llvm-readobj.exe" --file-headers "$d" | grep -i -E "ImageBase|Characteristics|DLL" | head -20
