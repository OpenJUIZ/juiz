name: Test (Windows)

# Windows でのビルドとテストと Windows の wheel。
# macOS は Linux の 10 倍、Windows は 2 倍で数えられ、PR のたびに動かすと Actions の
# 実行時間の大半を占めていたため、PR では動かさず main への push と手動実行でだけ動かす。
# PR で確かめたいときは、Actions の画面から PR のブランチを指定して手動実行する。
# Linux のジョブは test-linux.yml。
on:
  push:
    branches: [main]
    paths-ignore:
      # Rust のビルドとテストに影響しないファイルだけの変更ではジョブを走らせない。
      # examples/python と bindings/pyjuiz は Rust のテストから使われるので対象に含める。
      - "**.md"
      - "Dockerfile"
      - "compose.yml"
      - "build_docker.sh"
      - ".github/workflows/python.yml"
      - "webui/**"
      - ".github/workflows/webui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pyo3 が埋め込む Python をシステムの python3 に固定する
  PYO3_PYTHON: python3
  # Haskell の例(examples/haskell)に使う GHC と cabal の版(test-linux.yml と同じ)
  GHC_VERSION: "9.6.7"
  CABAL_VERSION: "3.18.1.0"

jobs:
  # Windows でのビルドとテスト。Python は actions/setup-python で入れ、
  # pyo3(auto-initialize)がその libpython にリンクする。C++ の例は MSVC と cmake でビルドする。
  # Haskell の例は GHC で DLL にする(issue #137、bindings/hsjuiz/README.md の「Windows」)。
  windows:
    name: Windows build & test
    runs-on: windows-latest
    env:
      # windows-latest の python3 は Microsoft Store のスタブになることがあるので python を使う
      PYO3_PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pyjuiz dependencies (used by the embedded Python)
        run: python -m pip install pyyaml httpx pillow numpy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Haskell の例のビルドに使う GHC と cabal を入れる。インストールに約 3 分かかるので、
      # test-linux.yml と同じく入れた GHC をキャッシュする。Windows の ghcup は C:\ghcup に入れる
      - name: Restore GHC
        id: ghc-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\ghcup\ghc\${{ env.GHC_VERSION }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      # キャッシュに GHC があれば、haskell-actions/setup はインストールを飛ばして ghcup set だけする
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          # examples/haskell の依存は GHC に付いてくるパッケージだけなので、Hackage の索引は使わない
          cabal-update: false
      # テストが失敗しても次から使えるよう、インストールした直後に保存する
      - name: Save GHC
        if: steps.ghc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\ghcup\ghc\${{ env.GHC_VERSION }}
          key: ${{ steps.ghc-cache.outputs.cache-primary-key }}

      # Windows で失敗するテストをまとめて把握できるよう --no-fail-fast で最後まで実行する
      - name: Build & test
        env:
          # GHC が入っていなければ Haskell のテストを飛ばさずにエラーにする
          JUIZ_REQUIRE_HASKELL: "1"
        run: scripts/test.sh --no-fail-fast

      - name: Test python-entry
        run: scripts/test.sh -p juiz_app --features python-entry --test python_entry_test

  # pip で入れる juiz(bindings/juiz_py、issue #88)の wheel を Windows でビルドし、
  # インストールした juiz コマンドで Python の Process とサンプルを動かす(juiz-wheels.yml)
  juiz-wheels:
    uses: ./.github/workflows/juiz-wheels.yml
    with:
      os: windows
