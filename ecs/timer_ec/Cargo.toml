[package]
name = "timer_ec"
license.workspace = true
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 既定の feature のうち embed-python だけを外す(EC のプラグインが libpython にリンクしないように、#322)。
# ほかは cargo の juiz と同じにする(ipc-broker・webui は構造体のフィールドを変えるので、Rust ABI で渡す型の形を揃える)。
# ワークスペース全体の cargo build では juiz_app の feature と合わさるので、配るときは cargo build -p timer_ec でビルドする
juiz_core = { workspace = true, features = ["swagger-ui", "webui", "ipc-broker"] }
