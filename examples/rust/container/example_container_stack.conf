"name": "test_system"
"option":
  "http_broker":
    "start": true
    "port": 8000
"plugins":  
  "container_factories":
    # example_container_stack_get は親の example_container の中身を ContainerImpl<ExampleContainer> として読むので、
    # 親とそのコンテナプロセスを今の Rust ABI で読む (abi: rust)。C ABI で読むと親の中身はプラグインの中にあり、
    # ホストからは見えない (docs/spec/rust-plugin-abi.md §8.1・§12)
    "example_container":
      "language": "rust"
      "path": "./target/debug"
      "abi": "rust"
      "processes":
        "example_container_get":
          "path": "./target/debug"
          "abi": "rust"
        "example_container_increment":
          "path": "./target/debug"
          "abi": "rust"
    "example_container_stack":
      "language": "rust"
      "path": "./target/debug"
      "processes":
        "example_container_stack_get":
          "path": "./target/debug"
"containers":
  - "type_name": "example_container"
    "name": "container0"
    "processes":
    - "type_name": "example_container_increment"
      "name": "increment0"
    - "type_name": "example_container_get"
      "name": "get0"
  - "type_name": "example_container_stack"
    "name": "container_stack0"
    "parent_container": 
      "name": "container0"
      "type_name": "example_container"
    "processes":
    - "type_name": "example_container_stack_get"
      "name": "stack_get0"
