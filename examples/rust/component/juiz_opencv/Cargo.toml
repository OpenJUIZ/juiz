[package]
name = "juiz_opencv"
license.workspace = true
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
opencv = {version="0.101", default-features=false, features=["highgui", "videoio", "imgproc", "imgcodecs", "clang-runtime"]}
juiz_sdk = { path="../../../../juiz_sdk/" }
