# talker_python → listener_python を 1 秒ごとに流す例 (issue #324)
# このディレクトリで juiz -f talker_listener.conf として起動する。
# パスはこのファイルの位置からの相対パス。
# juiz_core/tests/integration/python_example_conf_test.rs が読み込んで確かめている。
name: talker_listener_py
option:
  http_broker:
    start: true
    port: 8000
  # pip で pyjuiz を入れていないときのために、リポジトリの pyjuiz を見る
  pythonpath:
    - "../../../../bindings/pyjuiz"
plugins:
  process_factories:
    talker_python:
      language: python
      path: "./"
    listener_python:
      language: python
      path: "./"
processes:
  - type_name: talker_python
    name: talker0
  - type_name: listener_python
    name: listener0
connections:
  - name: con0
    connection_type: Push
    source:
      name: talker0
      type_name: talker_python
    destination:
      name: listener0
      type_name: listener_python
    arg_name: arg1
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker0
        type_name: talker_python
    auto_start: true
