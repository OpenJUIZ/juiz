"name": "haskell_component_example"
"plugins":
  "components":
    "example_component_hs":
      "language": "haskell"
      "path": "../../target"
"processes":
  - "type_name": "example_component_hs_increment"
    "name": "hsinc0"
  - "type_name": "example_component_hs_greet"
    "name": "hsgreet0"
"containers":
  - "type_name": "example_component_hs_counter"
    "name": "hscounter0"
    "value": 15
    "processes":
      - "type_name": "example_component_hs_counter_increment"
        "name": "hsinc1"
      - "type_name": "example_component_hs_counter_get"
        "name": "hsget1"
