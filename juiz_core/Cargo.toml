[package]
name = "juiz_core"
version = "0.0.15"
edition = "2021"
description = "Core library for JUIZ application. This package is not required if you want to build juiz functional module."
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "lib"]


[features]
# HTTP ブローカーの /docs で Swagger UI を提供する。オフでも /api-docs/openapi.json は提供する。
# 有効にするとビルドに zip が必要になるので、リポジトリの Cargo.lock を使ってビルドすること。
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
axum = {workspace = true}
futures ={workspace = true}
interprocess = {workspace = true, features=["tokio"]}
libloading = {workspace = true}

home = {workspace = true}


# opencv = {version="0.92.0", default-features=false, features=["highgui", "videoio", "imgproc", "imgcodecs", "clang-runtime"], optional=true}
pyo3 = {workspace = true, features=["auto-initialize", "gil-refs"]}

reqwest = {workspace = true, features = ["blocking", "json"]}
signal-hook = {workspace = true}


serde = {workspace = true, features = ["derive"]}

thiserror = {workspace = true}
tower-http = { workspace = true, features = ["fs", "trace"] }
tokio = {workspace = true, features = ["full"] }
uuid = {workspace = true, features = ["v4"] }
utoipa = {workspace = true, features = ["axum_extras"] }
# Swagger UI はオプション (feature "swagger-ui")。既定ではオフ。
# utoipa-swagger-ui はビルド時に zip に依存しており、crates.io の zip がほぼすべて
# yank されたため (2026-10-16)、依存に含めると crates.io から使う側で解決できなくなる。
utoipa-swagger-ui = {workspace = true, features = ["axum"], optional = true }


juiz_sdk = { workspace = true}