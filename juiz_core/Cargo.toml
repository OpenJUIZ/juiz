[package]
name = "juiz_core"
version = "0.0.25"
edition = "2021"
description = "Core library for JUIZ application. This package is not required if you want to build juiz functional module."
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# HTTP ブローカーの /docs で Swagger UI を提供する。オフでも /api-docs/openapi.json は提供する。
swagger-ui = ["dep:utoipa-swagger-ui"]

# 管理画面(webui)を埋め込み、HTTP ブローカーの /ui で配信する(issue #117)。
webui = ["dep:juiz_webui"]

# IPC ブローカー (同じマシンの別プロセスと Unix ソケット / 名前付きパイプでやり取りする、docs/spec/ipc-broker.md)
ipc-broker = ["dep:interprocess", "dep:widestring", "dep:windows-sys"]

default = ["embed-python", "swagger-ui", "webui", "ipc-broker"]
# Python の Process・Container・Component を読み込む。オフにすると pyo3 を使わず、libpython なしで動く。
python = ["dep:pyo3"]
# Python インタプリタを juiz の中で起動する(ネイティブバイナリ juiz_app 向け、libpython にリンクする)。
embed-python = ["python", "pyo3/auto-initialize"]
# juiz を Python の拡張モジュールとして Python プロセスの中で動かす(pip で入れる juiz 向け、libpython にリンクしない)。
# embed-python と同時に使わないこと(default-features = false で使う)。
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
axum = {workspace = true}
futures ={workspace = true}
libloading = {workspace = true}

home = {workspace = true}


# opencv = {version="0.92.0", default-features=false, features=["highgui", "videoio", "imgproc", "imgcodecs", "clang-runtime"], optional=true}
pyo3 = {workspace = true, features=["gil-refs"], optional = true}

reqwest = {workspace = true, features = ["blocking", "json"]}
signal-hook = {workspace = true}


serde = {workspace = true, features = ["derive"]}

thiserror = {workspace = true}
tower-http = { workspace = true, features = ["cors", "fs", "trace"] }
tokio = {workspace = true, features = ["full"] }
uuid = {workspace = true, features = ["v4"] }
utoipa = {workspace = true, features = ["axum_extras"] }
# Swagger UI はオプション (feature "swagger-ui"、既定でオン)。
utoipa-swagger-ui = {workspace = true, features = ["axum"], optional = true }


# 管理画面のビルド成果物(feature "webui"、既定でオン)
juiz_webui = { workspace = true, optional = true }

juiz_sdk = { workspace = true}

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows の IPC ブローカーは名前付きパイプ (feature "ipc-broker" のときだけ)
[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true, optional = true }
widestring = { version = "1", optional = true }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Pipes"] }

[dev-dependencies]
# ベンチ (tests/integration/image_transfer_bench.rs) で qmp ブローカーも測るため。
# 版を書かない path だけの dev-dependency は、crates.io に公開するときに外される
juiz_qmp_broker = { path = "../brokers/qmp_broker" }
