[package]
name = "juiz_core"
version = "0.0.18"
edition = "2021"
description = "Core library for JUIZ application. This package is not required if you want to build juiz functional module."
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "lib"]


[features]
# HTTP ブローカーの /docs で Swagger UI を提供する。オフでも /api-docs/openapi.json は提供する。
swagger-ui = ["dep:utoipa-swagger-ui"]

default = ["embed-python", "swagger-ui"]
# Python の Process・Container・Component を読み込む。オフにすると pyo3 を使わず、libpython なしで動く。
python = ["dep:pyo3"]
# Python インタプリタを juiz の中で起動する(ネイティブバイナリ juiz_app 向け、libpython にリンクする)。
embed-python = ["python", "pyo3/auto-initialize"]
# juiz を Python の拡張モジュールとして Python プロセスの中で動かす(pip で入れる juiz 向け、libpython にリンクしない)。
# embed-python と同時に使わないこと(default-features = false で使う)。
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
axum = {workspace = true}
futures ={workspace = true}
interprocess = {workspace = true, features=["tokio"]}
libloading = {workspace = true}

home = {workspace = true}


# opencv = {version="0.92.0", default-features=false, features=["highgui", "videoio", "imgproc", "imgcodecs", "clang-runtime"], optional=true}
pyo3 = {workspace = true, features=["gil-refs"], optional = true}

reqwest = {workspace = true, features = ["blocking", "json"]}
signal-hook = {workspace = true}


serde = {workspace = true, features = ["derive"]}

thiserror = {workspace = true}
tower-http = { workspace = true, features = ["cors", "fs", "trace"] }
tokio = {workspace = true, features = ["full"] }
uuid = {workspace = true, features = ["v4"] }
utoipa = {workspace = true, features = ["axum_extras"] }
# Swagger UI はオプション (feature "swagger-ui"、既定でオン)。
utoipa-swagger-ui = {workspace = true, features = ["axum"], optional = true }


juiz_sdk = { workspace = true}