[package]
name = "juiz_app"
version = "0.0.30"
edition = "2021"
description = "JUIZ utility command-line application package"
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
path = "src/lib.rs"

[[bin]]
name = "juiz"
path = "src/bin/juiz/main.rs"

[features]
default = ["embed-python", "swagger-ui", "qmp-broker", "webui", "ipc-broker"]
# Python の Process などを読み込む。Python を使わないなら
# cargo install juiz_app --no-default-features で libpython なしのバイナリになる。
embed-python = ["juiz_core/embed-python"]
# HTTP ブローカーの /docs で Swagger UI を提供する。
swagger-ui = ["juiz_core/swagger-ui"]
# 管理画面を埋め込み、HTTP ブローカーの /ui で配信する(issue #117)。
webui = ["juiz_core/webui"]
# QUIC (qmp) ブローカーを組み込む。設定ファイルの brokers / broker_proxies に type_name: qmp を書くだけで使える
# (plugins.broker_factories でプラグインを読み込む必要が無い)。issue #63
qmp-broker = ["dep:juiz_qmp_broker"]
# IPC ブローカーを組み込む。juiz -d --ipc <name> で起動し、同じマシンから -s ipc://<name> で繋ぐ (issue #233)
ipc-broker = ["juiz_core/ipc-broker"]
# Python から juiz を起動する入口(juiz_app::python)。pip で入る juiz コマンドが使う(issue #88)。
# libpython へのリンクは embed-python か juiz_core/extension-module で別に選ぶ。
python-entry = ["juiz_core/python", "dep:pyo3"]

[dependencies]

clap = {workspace = true}
home = {workspace = true}
juiz_core = { workspace = true, default-features = false }
juiz_idl = { workspace = true }
juiz_sdk = { workspace = true }
juiz_qmp_broker = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
# juiz pack / juiz run (.juizapp、docs/spec/app-package.md、#285)
globset = "0.4"
semver = "1"
sha2 = { workspace = true }
yaml-rust2 = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"

