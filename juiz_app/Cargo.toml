[package]
name = "juiz_app"
version = "0.0.15"
edition = "2021"
description = "JUIZ utility command-line application package"
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[[bin]]
name = "juiz"
path = "src/bin/juiz/main.rs"

[dependencies]

clap = {workspace = true}
home = {workspace = true}
# Swagger UI を使うときは juiz_core の feature "swagger-ui" を有効にしてビルドする
# (例: cargo build -p juiz_app --features juiz_core/swagger-ui)。
# ここに feature を置くと、使わなくても cargo install juiz_app が zip を解決しようとして失敗する。
juiz_core = { workspace = true }


[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"

