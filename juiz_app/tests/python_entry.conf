# python_entry_test.rs で使う設定。パスはこのファイルの位置(tests)からの相対パス。
"name": "python_entry_test"
"option":
  "http_broker":
    "start": false
  # Python プラグインの位置からの相対パス
  "pythonpath":
    - "../../../bindings/pyjuiz"
"plugins":
  "process_factories":
    "py_increment":
      "language": "python"
      "path": "../../juiz_core/tests/python"
"processes":
  - "type_name": "py_increment"
    "name": "pyinc0"
